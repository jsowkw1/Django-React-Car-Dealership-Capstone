name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  express-api:
    name: Express API tests (Node 22 + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: express-api/package-lock.json
      - run: npm ci
      - name: Run API tests (embedded MongoDB)
        run: npm test

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: 'False'
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 djangoapp djangoproj --max-line-length=130 --exclude=migrations
      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate and seed
        run: python manage.py migrate && python manage.py seed_demo
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Django tests
        run: python manage.py test djangoapp -v 2

  docker:
    name: Production image smoke test
    runs-on: ubuntu-latest
    needs: [express-api, django]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (Django + React + Express + MongoDB)
        run: docker build -t bestcars .
      - name: Run container
        run: |
          docker run -d --name bestcars -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke-test -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e CSRF_TRUSTED_ORIGINS=http://localhost:8000 bestcars
      - name: Wait for the app and check endpoints
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/djangoapp/get_dealers > /dev/null && break
            sleep 2
          done
          docker logs bestcars | tail -n 30
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          curl -sf http://localhost:8000/djangoapp/get_dealers/Kansas | grep -q 'Sunflower State Motors'
          curl -sf http://localhost:8000/djangoapp/reviews/dealer/1 | grep -q '"sentiment"'
          curl -sf "http://localhost:8000/djangoapp/analyze/Fantastic%20services" | grep -q '"sentiment": "positive"'
          curl -sf http://localhost:8000/djangoapp/get_cars | grep -q 'Camry'
          curl -sf http://localhost:8000/static/favicon.svg > /dev/null
          echo "Smoke test passed"
